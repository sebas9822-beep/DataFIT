# --- Normalizacion de nombres ---
siglas: [IE, IPS, EPS, ESE, CAI, SENA, UPB, EAFIT, CES, ITM, EPM, UVA, INDER, CEDEZO, SAS, SA, LTDA,
         UNAL, UDEA, POT, PH, RPH, CC, UNE, EDU, MAMM, CDI, DAP, APH, ICBF, INEM, CEFA, USB, UCC, ESU]
minusculas: [de, del, en, y, e, a, al, por, para, con]   # siempre en minuscula dentro del nombre
articulos: [la, las, los, el]                            # en minuscula solo despues de una preposicion
genericos_clave:                # se quitan al comparar nombres entre fuentes
  [institucion, educativa, colegio, escuela, sede, seccion, ie, centro, parque, edificio, conjunto,
   residencial, urbanizacion, unidad, clinica, hospital, drogueria, farmacia, estacion, cai,
   biblioteca, supermercado, tienda, universidad, universitaria, fundacion, corporacion,
   de, del, la, las, los, el, y, e, en, sas, sa, ltda, ph]
