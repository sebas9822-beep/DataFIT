# TAXONOMIA unica de la captura: a que categoria va cada registro segun su fuente.
# Los valores de GeoMedellin, Toponimia y establecimientos se listaron del servicio real el 20-nov-2026.
version: "1.0"

categorias:
  educacion:           {etiqueta: "Educación",            color: "#3d6fb6", letra: "E"}
  salud:               {etiqueta: "Salud",                color: "#c8553d", letra: "S"}
  parques:             {etiqueta: "Parques",              color: "#4f8a5b", letra: "P"}
  cultura:             {etiqueta: "Cultura",              color: "#8a5fa8", letra: "C"}
  seguridad:           {etiqueta: "Seguridad",            color: "#0a1628", letra: "G"}
  movilidad:           {etiqueta: "Movilidad",            color: "#d98b2b", letra: "M"}
  abastecimiento:      {etiqueta: "Abastecimiento",       color: "#a98a1f", letra: "A"}
  empresas:            {etiqueta: "Empresas",             color: "#2f8f9d", letra: "N"}
  residencial:         {etiqueta: "Edificios y conjuntos", color: "#7fa598", letra: "R", oculta_al_abrir: true}
  otros_equipamientos: {etiqueta: "Otros equipamientos",  color: "#6b7a8a", letra: "O"}

# --- Google Places (New): cada lista es UNA solicitud; tipos verificados en la Tabla A ---
google:
  educacion:      [[preschool, primary_school, secondary_school, school, university]]
  salud:          [[hospital, medical_clinic], [doctor, dentist, pharmacy, drugstore]]
  parques:        [[park, city_park, playground, dog_park]]
  cultura:        [[museum, library, art_gallery, cultural_center, performing_arts_theater]]
  seguridad:      [[police, fire_station]]
  movilidad:      [[subway_station, light_rail_station, train_station, bus_station, transit_station],
                   [bus_stop, taxi_stand, parking]]
  abastecimiento: [[supermarket, grocery_store, market, shopping_mall, convenience_store]]
  empresas:       [[corporate_office, coworking_space, business_center, bank, insurance_agency, real_estate_agency]]
google_conjunto: [apartment_complex, condominium_complex, housing_complex, apartment_building]

