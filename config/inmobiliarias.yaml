# Inmobiliarias y portales donde el RPA busca anuncios vigentes (decisiones DU-23 y DU-27).
#
# Origen: listado de Sebastián "Inmobiliarias de Medellín y Antioquia: sitios web aptos para RPA" (prueba con
# navegador del 23-nov-2026: apartamento en venta en Laureles, 80 m²) y "Concepto unificado de fuentes".
#
# Cada sitio:
#   id, nombre, dominio   el dominio es el único que el RPA puede abrir para ese sitio
#   tipo                  portal | inmobiliaria | agregador
#   nivel                 A = la búsqueda va en la URL · B = solo por formulario · C = listado de venta sin filtros en la URL
#   busqueda              URL que funcionó en la prueba externa (apartamento, venta, Laureles). El RPA la adapta al
#                         barrio y al tipo de inmueble que pidió el cliente
#   permitida             false = no se consulta nunca (sus términos lo prohíben). Se muestra tachada
#   por_defecto           true = sale encendida en la pantalla. El comercial puede apagarla o encenderla
#   lectura               resultado de la prueba con el motor de esta aplicación (scripts/probar_inmobiliarias.py):
#                         ok | sin_resultados | no_legible | bloqueado | sin_probar
#   revision_terminos     pendiente | <fecha> cuando Venture One revise los términos de uso del sitio (decisión A-08)
#
# Agregar una inmobiliaria: una entrada aquí con su nombre, su dominio y, si se conoce, su URL de búsqueda.
# Las descartadas no se consultan ni se muestran: quedan aquí con su motivo.

