    filtros: "Venta · Apto · Ciudad · Laureles"
    prueba_externa: "Consulta OK · ≈30 resultados"
    permitida: true
    por_defecto: true
    lectura: ok        # probado el 2026-11-23
    revision_terminos: pendiente
